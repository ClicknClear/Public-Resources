name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"
          scope: "@clicknclear-public"
          cache: "pnpm"

      - uses: pnpm/action-setup@v3
        with:
          version: 11.5.2

      - name: Install
        run: |
          pnpm i
      - name: Lint and Test
        run: |
          pnpm lerna run test
          pnpm lerna run lint

      - name: Check Packages Are deployed
        run: |
          bash ./Packages-Check.sh
